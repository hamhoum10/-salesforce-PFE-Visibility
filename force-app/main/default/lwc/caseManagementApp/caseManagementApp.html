<template>
    <lightning-card title="Case Management">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button label="Unlinked Cases"
                                      onclick={showUnlinkedCases}
                                      variant={unlinkedVariant}
                                      class="slds-button_stretch"></lightning-button>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button label="Linked Cases"
                                      onclick={showLinkedCases}
                                      variant={linkedVariant}
                                      class="slds-button_stretch"></lightning-button>
                </div>
            </div>

            <div class="slds-m-top_medium">
                <template lwc:if={showUnlinked}>
                    <c-unlinked-cases-table onlinkcase={handleLinkCase}></c-unlinked-cases-table>
                </template>
                <template lwc:if={showLinked}>
                    <c-linked-cases-table onviewaccountdetail={handleViewAccountDetail}></c-linked-cases-table>
                </template>
            </div>
        </div>
    </lightning-card>

    <template lwc:if={isAccountSearchModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeAccountSearchModal}>
                        <lightning-icon icon-name="utility:close"
                                        alternative-text="Close"
                                        variant="inverse"
                                        size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-text-heading_medium slds-hyphenate">Link Account to Case</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <c-account-search-and-link
                        case-id={selectedCaseIdForLinking}
                        onaccountlinked={handleAccountLinked}
                        oncancel={closeAccountSearchModal}>
                    </c-account-search-and-link>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template lwc:if={isAccountDetailsModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true" aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeAccountDetailsModal}>
                        <lightning-icon icon-name="utility:close"
                                        alternative-text="Close"
                                        variant="inverse"
                                        size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-02" class="slds-modal__title slds-text-heading_medium slds-hyphenate">Account and Order Details</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <c-account-details-and-orders
                        account-id={selectedAccountIdForDetails}
                        onvieworderitems={handleViewOrderItems}
                        onclose={closeAccountDetailsModal}>
                    </c-account-details-and-orders>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template lwc:if={isOrderItemsModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-03" aria-modal="true" aria-describedby="modal-content-id-3" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeOrderItemsModal}>
                        <lightning-icon icon-name="utility:close"
                                        alternative-text="Close"
                                        variant="inverse"
                                        size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-03" class="slds-modal__title slds-text-heading_medium slds-hyphenate">Order Item Details</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
                    <c-order-item-details
                        order-items={selectedOrderItems}
                        onclose={closeOrderItemsModal}>
                    </c-order-item-details>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
