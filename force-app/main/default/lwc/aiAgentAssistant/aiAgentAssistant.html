<template>
    <lightning-card title="AI Chat Agent" icon-name="utility:chat">
        <div class="slds-card__body slds-p-around_medium">
            <div class="chat-history">
                <template for:each={chatMessages} for:item="msg">
                    <p key={msg.id} class={msg.type}>{msg.text}</p>
                </template>
                <template if:true={isThinking}>
                    <p class="agent-message slds-text-align_center">Agent is typing...</p>
                </template>
            </div>

            <div class="slds-m-top_medium">
                <lightning-input
                    label="Your Message"
                    value={currentMessage}
                    onchange={handleMessageChange}
                    onkeyup={handleKeyUp}
                    data-id="chatInput"
                ></lightning-input>
                <lightning-button
                    label="Send"
                    variant="brand"
                    onclick={handleSendMessage}
                    class="slds-m-top_small"
                    disabled={isSending}
                ></lightning-button>
            </div>
        </div>

        <template if:true={flowStarted}>
            <div style="display: none;">
                <lightning-flow
                    flow-api-name={flowApiName}
                    flow-input-variables={flowInputVariables}
                    onstatuschange={handleFlowStatusChange}
                ></lightning-flow>
            </div>
        </template>
    </lightning-card>
</template>
