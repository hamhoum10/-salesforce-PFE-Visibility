<!-- accountDetailsAndOrders.html -->
<template>
    

  <lightning-card title=" Orders" icon-name="standard:account">
        <div class="slds-m-around_medium">
           

            <h3 class="slds-m-top_medium">Orders</h3>
            <template lwc:if={isLoading}>
                <lightning-spinner size="medium"></lightning-spinner>
            </template>
            <template lwc:elseif={orders.length}>
                <lightning-datatable
                    key-field="orderId"
                    data={sortedOrders}
                    columns={orderColumns}
                    onsort={handleSort}
                    sorted-by={sortBy}
                    sorted-direction={sortDirection}
                    onrowaction={handleOrderRowAction}>
                </lightning-datatable>
            </template>
            <template lwc:elseif={noOrdersFound}>
                <p>No orders found for this account.</p>
            </template>
            <template lwc:if={ordersError}>
                <p class="slds-text-color_error">Error loading orders: {ordersError}</p>
            </template>
        </div>
    </lightning-card>

    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Order Items for Order ID: {selectedOrderId}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <c-order-item-details 
                        order-items={modalOrderItems}
                        sort-by={orderItemSortBy}
                        sort-direction={orderItemSortDirection}
                        onrefresh={handleOrderItemsRefresh}>
                    </c-order-item-details>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
